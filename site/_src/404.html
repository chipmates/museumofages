<!doctype html>
<html lang="en" class="sheet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head.csp}}<meta name="robots" content="noindex">
<title>{{en_title}} | Museum of Ages, a digital museum</title>
<style>{{css}}</style>
<style id="faces" media="not all">{{css.faces}}</style>
<noscript><style>{{css.faces}}</style></noscript>
<meta name="color-scheme" content="light dark">
{{head.icons}}
<meta name="theme-color" content="{{theme_color}}">
</head>
<body class="doc stub">
{{header}}

<!-- Served for every address without a page, at any depth: every link and file here starts at the site's root. -->
<main id="main" class="statement">
  <div class="wrap stub__in">
    <div class="statement__head">
      <h1>{{en_title}}</h1>
    </div>
    <p class="lead">{{en_p}}</p>
    <p><a class="more more--back" href="{{href.home}}"><span>{{en_back}}</span></a></p>
    <hr>
    <div lang="de">
      <h2>{{de_title}}</h2>
      <p class="lead">{{de_p}}</p>
      <p><a class="more more--back" href="{{href.home_de}}"><span>{{de_back}}</span></a></p>
    </div>
    <p class="stub__go"><a class="door" href="{{href.enter}}"><span>{{en_enter}}</span>{{svg.arrow}}</a></p>
  </div>
</main>

{{footer}}
{{script.faces}}
<script src="{{static}}site.js" defer></script>
</body>
</html>
