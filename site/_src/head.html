<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head.csp}}{{head.robots}}{{head.preload}}<title>{{head.title}}</title>
<meta name="description" content="{{head.description}}">
<style>{{css.inline}}</style>
<style id="faces" media="not all">{{css.faces}}</style>
<noscript><style>{{css.faces}}</style>{{head.rest_noscript}}</noscript>
{{head.rest_link}}<link rel="canonical" href="{{head.canonical}}">
<link rel="alternate" hreflang="en" href="{{head.url_en}}">
<link rel="alternate" hreflang="de" href="{{head.url_de}}">
<link rel="alternate" hreflang="x-default" href="{{head.url_en}}">
<meta name="color-scheme" content="{{head.scheme}}">
{{head.icons}}
<meta name="theme-color" content="{{theme_color}}">
<meta property="og:type" content="{{head.og_type}}">
<meta property="og:site_name" content="Museum of Ages">
<meta property="og:title" content="{{head.og_title}}">
<meta property="og:description" content="{{head.description}}">
<meta property="og:url" content="{{head.canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{head.og_image}}">
<meta property="og:image:width" content="{{head.og_w}}">
<meta property="og:image:height" content="{{head.og_h}}">
<meta property="og:image:alt" content="{{head.og_alt}}">
<meta name="twitter:card" content="summary_large_image">
